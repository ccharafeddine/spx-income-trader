# ============================================
# PORTFOLIO-WIDE SETTINGS
# Coordinates all parallel strategies
# ============================================
portfolio:
  account_size: 50000.0        # Starting account size for risk calculations
  max_total_positions: 2       # Max concurrent positions (1 daily 0DTE + 1 swing)
  max_0dte_positions: 1        # Max same-day expiration positions (DI/ORB/B&B share slot)
  max_daily_risk_pct: 5.0      # Max % of account at risk at any time
  max_daily_loss_pct: 2.0      # Circuit breaker at 2% REALIZED loss
  # At $50k: 2% = $1000 max loss
  # At $100k: 2% = $2000 max loss
  # Scales automatically with account growth

  # Dynamic Position Sizing
  position_sizing:
    method: "percent_risk"     # "percent_risk", "fixed_contracts", or "kelly"
    risk_per_trade_pct: 2.0    # Risk 2% of account per trade
    min_contracts: 1           # Never less than 1 contract
    max_contracts: 20          # Cap regardless of account size
    # percent_risk: Sizes position to risk X% of account
    # fixed_contracts: Uses contracts_per_trade from strategy config
    # kelly: Optimal sizing based on historical win rate (needs 10+ trades)

  # Strategy priority (highest priority enters first if slots limited)
  priority:
    - bnb            # Honor overnight signals first
    - daily_income   # Core strategy
    - orb            # Secondary 0DTE
    - tag_n_turn     # Swing, can wait

# ============================================
# DAILY INCOME STRATEGY (Core)
# ============================================
daily_income:
  enabled: true  # Master toggle for daily income strategy

strategy:
  # Pulse bar detection threshold (% of bar range)
  pulse_threshold: 10.0

  # Credit spread width in dollars
  spread_width: 5.0

  # Profit target as % of max profit
  profit_target_pct: 80.0

  # Number of contracts per trade
  contracts_per_trade: 5

risk:
  # Maximum position size (contracts)
  max_position_size: 5
  
  # Maximum daily loss before stopping ($)
  max_daily_loss: 1000
  
  # Maximum risk per trade as % of account
  max_account_risk_pct: 2.0

timing:
  # Morning trading window (EST)
  morning_start: "09:30"
  morning_end: "11:30"
  
  # Market close time (EST)
  market_close: "16:00"

  # Afternoon setup window - Bed & Breakfast system (p.23-26)
  # Uses same pulse bar logic in last 60 min of trading day
  afternoon_enabled: false
  afternoon_start: "15:00"
  afternoon_end: "15:30"

  # Timezone
  timezone: "America/New_York"

execution:
  # Minimum credit to accept (% of expected)
  min_credit_pct: 90.0

  # Hard floor for credit received ($) - spreads below this are rejected
  min_credit: 1.00
  
  # Order timeout in seconds
  order_timeout: 30
  
  # Max slippage tolerance ($)
  max_slippage: 0.10

monitoring:
  # Position check interval (seconds)
  check_interval: 60

  # Enable 1pm trend check (Production Line Trading p.19-20)
  # At 1pm ET, evaluates positions based on market conditions:
  #   - Trending day (>threshold move): Hold to expiration
  #   - Non-trending + favorable: Close at 40%+ profit
  #   - Non-trending + unfavorable: Close if losing >10%
  enable_1pm_check: true

  # Auto-close based on rules, or just log recommendation
  auto_1pm_close: true

  # Dollar move threshold to classify as "trending" day
  trending_threshold: 15.0

filters:
  # Bollinger Band directional bias filter (Tag 'n Turn, p.30-33)
  bollinger_enabled: true
  bollinger_period: 50
  bollinger_std: 2.0

  # Extreme move override: when intraday move exceeds this %, allow setups
  # in the direction of that move regardless of BB bias.
  # E.g., if SPX is down >1.5% from open, allow bearish setups even if BB bias is bullish.
  # Set to 0 to disable this override.
  extreme_move_override_pct: 1.5

# Tag 'n Turn - Weekly Swing Strategy (Production Line Trading p.30-33)
# Separate from daily income strategy - can run in parallel
tag_n_turn:
  enabled: true  # Start disabled, enable when ready to test

  # Bollinger Band parameters (50-period, 2 std on 30-min bars)
  bb_period: 50
  bb_std: 2.0

  # Pulse bar threshold for reversal detection
  pulse_threshold: 10.0

  # Maximum holding period (days)
  max_hold_days: 7

  # Position type: credit spreads vs directional options
  use_credit_spreads: true

  # Position sizing for swings (separate from daily)
  contracts_per_trade: 2  # Smaller size for multi-day risk

  # For credit spreads (when use_credit_spreads: true)
  spread_width: 10.0  # Wider spreads for multi-day
  min_credit: 2.00

  # For directional options (when use_credit_spreads: false)
  delta_target: 0.70  # ITM options for directional plays

  # DTE range for swing trades
  min_dte: 3
  max_dte: 7

# B&B (Bed & Breakfast) Strategy - Production Line Trading p.23-25
# Includes Just Breakfast (p.26)
# Detects end-of-day pulse setups for next-day morning entry
bnb:
  enabled: true  # Enable when ready to test

  # Pulse bar detection threshold
  pulse_threshold: 10.0

  # Position sizing
  contracts_per_trade: 3

  # Just Breakfast settings
  # If first bar of next day confirms signal direction, roll into daily setup
  aggressive_roll: true

# ORB (Opening Range Breakout) Strategy - Production Line Trading p.22
# Uses first 30-min bar range with relaxed thresholds
# Good for set-and-forget trading
orb:
  enabled: true  # Enable when ready to test

  # Threshold range (more flexible than strict 10%)
  min_threshold: 10.0  # Strong signal threshold
  max_threshold: 40.0  # Relaxed signal threshold

  # Position sizing
  contracts_per_trade: 3

# ============================================
# PDT (Pattern Day Trader) RULE PROTECTION
# ============================================
# Prevents PDT rule violations for accounts under $25,000
# A "day trade" = position opened AND actively closed same day
# Expiration (0DTE running to close) does NOT count as day trade
pdt:
  # Master switch - set to false to disable PDT protection entirely
  pdt_protection: true

  # Account equity threshold - PDT rules apply below this amount
  # At or above this threshold, unlimited day trades are allowed
  pdt_threshold: 25000

  # Maximum day trades allowed in the rolling window
  # FINRA PDT rule allows 3 day trades per 5 business days
  pdt_max_day_trades: 3

  # Rolling window in business days (excludes weekends and NYSE holidays)
  pdt_window_days: 5